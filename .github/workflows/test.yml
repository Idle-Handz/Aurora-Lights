name: Tests

on:
  push:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.Importer/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/build-release-notes.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.Importer/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/build-release-notes.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore .NET tests
        run: dotnet restore Aurora.Tests/Aurora.Tests.csproj

      - name: Run .NET tests
        run: dotnet test Aurora.Tests/Aurora.Tests.csproj -c Release --no-restore

      - name: Test release-note compiler
        run: npm run test:release-notes

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run browser tests
        run: npm run e2e
