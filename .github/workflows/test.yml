name: Tests

on:
  push:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.DataIntegration/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Presentation.Tests/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'Builder.Core/**'
      - 'Builder.Data/**'
      - 'Aurora.Documents/**'
      - 'Aurora.Presentation/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'AuroraContent.props'
      - 'nuget.config'
      - 'vendor/nuget/**'
      - 'tests/**'
      - 'tools/AssemblyApi/**'
      - 'tools/WpfAssemblyApi/**'
      - 'tools/legacy-restoration/**'
      - 'tools/build-release-notes.mjs'
      - 'tools/verify-buffer-channels.mjs'
      - 'tools/schedule-buffer-posts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.ui.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.DataIntegration/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Presentation.Tests/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'Builder.Core/**'
      - 'Builder.Data/**'
      - 'Aurora.Documents/**'
      - 'Aurora.Presentation/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'AuroraContent.props'
      - 'nuget.config'
      - 'vendor/nuget/**'
      - 'tests/**'
      - 'tools/AssemblyApi/**'
      - 'tools/WpfAssemblyApi/**'
      - 'tools/legacy-restoration/**'
      - 'tools/build-release-notes.mjs'
      - 'tools/verify-buffer-channels.mjs'
      - 'tools/schedule-buffer-posts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'playwright.ui.config.ts'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      buffer_api_check:
        description: Run a read-only Buffer API channel check.
        required: false
        type: boolean
        default: false
      buffer_schedule:
        description: Schedule the supplied X and Threads posts in Buffer.
        required: false
        type: boolean
        default: false
      buffer_posts_json:
        description: JSON array with one X post and one Threads post.
        required: false
        type: string
        default: '[]'
      buffer_due_at_utc:
        description: UTC time in ISO 8601 format, for example 2026-10-23T17:00:00.000Z.
        required: false
        type: string
        default: ''
      buffer_edit_post_id:
        description: Buffer post id to edit with new text.
        required: false
        type: string
        default: ''
      buffer_edit_post_text:
        description: Replacement text for the post being edited.
        required: false
        type: string
        default: ''

  workflow_call:

jobs:
  test:
    if: ${{ !inputs.buffer_api_check && !inputs.buffer_schedule }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Keep native commands in separate steps so a later success cannot mask a failure.
      - name: Restore core .NET tests
        run: dotnet restore Aurora.Tests/Aurora.Tests.csproj

      - name: Restore presentation .NET tests
        run: dotnet restore Aurora.Presentation.Tests/Aurora.Presentation.Tests.csproj

      - name: Run core .NET tests
        run: dotnet test Aurora.Tests/Aurora.Tests.csproj -c Release --no-restore

      - name: Run presentation .NET tests
        run: dotnet test Aurora.Presentation.Tests/Aurora.Presentation.Tests.csproj -c Release --no-restore

      - name: Test legacy API compatibility comparison
        shell: pwsh
        run: .\tools\legacy-restoration\Test-ApiCompatibility.ps1

      - name: Verify required legacy API compatibility (additions allowed)
        shell: pwsh
        run: |
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Builder.Core.dll -RestoredAssembly .\Builder.Core\bin\Release\net10.0\Builder.Core.dll
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Builder.Data.dll -RestoredAssembly .\Builder.Data\bin\Release\net10.0\Builder.Data.dll
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Aurora.Documents.dll -RestoredAssembly .\Aurora.Documents\bin\Release\net10.0\Aurora.Documents.dll
          .\tools\legacy-restoration\Compare-RestoredWpfAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Aurora.Presentation.dll -RestoredAssembly .\Aurora.Presentation\bin\Release\net10.0-windows\Aurora.Presentation.dll

      - name: Verify restored legacy behavior parity
        shell: pwsh
        run: |
          .\tools\legacy-restoration\Compare-BuilderDataBehavior.ps1 -Configuration Release
          .\tools\legacy-restoration\Compare-AuroraDocumentsBehavior.ps1 -Configuration Release
          .\tools\legacy-restoration\Compare-AuroraPresentationBehavior.ps1 -Configuration Release

      - name: Test release-note compiler
        run: npm run test:release-notes

      - name: Test Buffer scheduling helpers
        run: npm run test:buffer

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run e2e

      - name: Run App workspace layout regressions
        run: npm run test:ui-layout

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  buffer-api-check:
    if: ${{ inputs.buffer_api_check }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Buffer key and channel mappings without logging IDs
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_THREADS_CHANNEL_ID: ${{ vars.BUFFER_THREADS_CHANNEL_ID }}
        run: node tools/verify-buffer-channels.mjs

  buffer-edit:
    if: ${{ inputs.buffer_edit_post_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Edit scheduled Buffer post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_EDIT_POST_ID: ${{ inputs.buffer_edit_post_id }}
          BUFFER_EDIT_POST_TEXT: ${{ inputs.buffer_edit_post_text }}
        run: node tools/buffer-edit-post.mjs
  buffer-schedule:
    if: ${{ inputs.buffer_schedule }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Schedule X and Threads posts in Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_THREADS_CHANNEL_ID: ${{ vars.BUFFER_THREADS_CHANNEL_ID }}
          BUFFER_POSTS_JSON: ${{ inputs.buffer_posts_json }}
          BUFFER_DUE_AT_UTC: ${{ inputs.buffer_due_at_utc }}
        run: node tools/schedule-buffer-posts.mjs

      - name: Show scheduled Buffer posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ vars.BUFFER_X_CHANNEL_ID }}
          BUFFER_THREADS_CHANNEL_ID: ${{ vars.BUFFER_THREADS_CHANNEL_ID }}
        run: node tools/list-scheduled-posts.mjs
