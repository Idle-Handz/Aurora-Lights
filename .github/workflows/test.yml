name: Tests

on:
  push:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.Importer/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Presentation.Tests/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'Builder.Core/**'
      - 'Builder.Data/**'
      - 'Aurora.Documents/**'
      - 'Aurora.Presentation/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/AssemblyApi/**'
      - 'tools/WpfAssemblyApi/**'
      - 'tools/legacy-restoration/**'
      - 'tools/build-release-notes.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'Aurora.App/**'
      - 'Aurora.Components/**'
      - 'Aurora.Importer/**'
      - 'Aurora.Logic/**'
      - 'Aurora.PdfImport/**'
      - 'Aurora.Presentation.Tests/**'
      - 'Aurora.Tests/**'
      - 'Aurora.Web/**'
      - 'Builder.Core/**'
      - 'Builder.Data/**'
      - 'Aurora.Documents/**'
      - 'Aurora.Presentation/**'
      - 'docs/release-notes/**'
      - 'lib/**'
      - 'tests/**'
      - 'tools/AssemblyApi/**'
      - 'tools/WpfAssemblyApi/**'
      - 'tools/legacy-restoration/**'
      - 'tools/build-release-notes.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/test.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore .NET tests
        run: |
          dotnet restore Aurora.Tests/Aurora.Tests.csproj
          dotnet restore Aurora.Presentation.Tests/Aurora.Presentation.Tests.csproj

      - name: Run .NET tests
        run: |
          dotnet test Aurora.Tests/Aurora.Tests.csproj -c Release --no-restore
          dotnet test Aurora.Presentation.Tests/Aurora.Presentation.Tests.csproj -c Release --no-restore

      - name: Verify restored legacy API parity
        shell: pwsh
        run: |
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Builder.Core.dll -RestoredAssembly .\Builder.Core\bin\Release\net10.0\Builder.Core.dll
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Builder.Data.dll -RestoredAssembly .\Builder.Data\bin\Release\net10.0\Builder.Data.dll
          .\tools\legacy-restoration\Compare-RestoredAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Aurora.Documents.dll -RestoredAssembly .\Aurora.Documents\bin\Release\net10.0\Aurora.Documents.dll
          .\tools\legacy-restoration\Compare-RestoredWpfAssemblyApi.ps1 -Configuration Release -OracleAssembly .\tests\LegacyOracles\Aurora.Presentation.dll -RestoredAssembly .\Aurora.Presentation\bin\Release\net10.0-windows\Aurora.Presentation.dll

      - name: Verify restored legacy behavior parity
        shell: pwsh
        run: |
          .\tools\legacy-restoration\Compare-BuilderDataBehavior.ps1 -Configuration Release
          .\tools\legacy-restoration\Compare-AuroraDocumentsBehavior.ps1 -Configuration Release
          .\tools\legacy-restoration\Compare-AuroraPresentationBehavior.ps1 -Configuration Release

      - name: Test release-note compiler
        run: npm run test:release-notes

      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Run browser tests
        run: npm run e2e
